name: Reportar un error
description: Algo no funciona como esperabas
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Gracias por probar xdir. Mientras más concreto el reporte, más rápido se arregla.
  - type: input
    id: version
    attributes:
      label: Versión de xdir
      description: La de la release que descargaste (por ejemplo 0.1.6).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Cómo lo instalaste
      options: [Instalador, ZIP portable]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      description: Por ejemplo Windows 11 23H2 o Windows 10 22H2.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir ...
        2. Hacer clic derecho en ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué pasó en cambio
      description: Puedes arrastrar capturas o videos cortos acá.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Más contexto
      description: Rutas de red, varios monitores, DPI alto, antivirus, etc. (opcional).
