[package]
name = "xdir-mac"
version.workspace = true
edition.workspace = true

[[bin]]
name = "xdir-mac"
path = "src/main.rs"

[dependencies]
xdir-core = { path = "../xdir-core" }

# macOS: AppKit, Core Graphics y Core Text a través de los bindings de objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
# Spotlight (MDItem) para las columnas de metadatos.
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "Metadata", "MDItem"] }
objc2-quick-look-thumbnailing = "0.3.2"
# Vista rápida: el panel de QuickLook del sistema (`QLPreviewPanel`).
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
objc2-uniform-type-identifiers = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
notify = "8"
libc = "0.2"

[features]
# Árbol de carpetas lateral (F-3.5), experimental: incluido por defecto pero oculto hasta que se
# enciende (switch de la rueda dentada o ⇧⌘E). Para quitarlo del programa:
# cargo build --release -p xdir-mac --no-default-features
default = ["arbol"]
arbol = ["xdir-core/arbol"]
# Gancho de pruebas: deja manejar la ventana desde otro proceso (capturas y pruebas automáticas
# sin mouse real). Nunca se compila en la versión normal.
pruebas = ["xdir-core/pruebas"]
